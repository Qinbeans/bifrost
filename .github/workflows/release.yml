# Releases the compiler. Releasing is bumping `version` in pyproject.toml
# (`uv version --bump patch`) and pushing it to main: when no tag `v<version>`
# exists yet, the compiler is tested, built (one pure-Python wheel and an sdist),
# installed fresh the way users install it, and published as release
# `v<version>` (creating the tag at that commit). The package index at
# https://qinbeans.github.io/mlir-python/, which also lists mlir-python and
# tree-sitter-bifrost, then lists it:
#   uv tool install bifrost-lang --find-links https://qinbeans.github.io/mlir-python/
# Bifrost packages (`<name>-v<version>` tags) release from packages.yml, the
# same way. Running it by hand releases a version not yet released (after a
# failed run, say); a push without a new version, or a pull request, builds and
# tests without releasing.
name: Release

on:
  push:
    branches: [main]
    # A version bump; or this workflow changed, which releases a version not yet released.
    paths: ["pyproject.toml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["pyproject.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Find a new version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - id: plan
        run: |
          version=$(uv version --short)
          release=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "v$version is released already"
            else
              release=true
              echo "v$version is new: releasing it"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    name: Test and build ${{ needs.plan.outputs.version }}
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # clang links what bfc compiles; the runner image has it.
      - name: Test
        run: |
          clang --version
          uv sync --frozen --extra dev
          uvx ruff check src tests tools
          uvx ruff format --check src tests tools
          uv run --frozen pytest -q

      - name: Build
        run: uv build --out-dir dist

      # The wheel alone, its dependencies from the index: what a user gets.
      - name: Install it and build a new project
        run: |
          uv tool install dist/*.whl --find-links https://qinbeans.github.io/mlir-python/
          bfc --version
          cd "$RUNNER_TEMP"
          bfc init hello
          cd hello
          bfc build
          ./build/hello

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  release:
    name: Release v${{ needs.plan.outputs.version }}
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Creates the tag at this commit.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          name: bifrost v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            The Bifrost compiler, `bfc`. Install it with
            ```
            uv tool install bifrost-lang==${{ needs.plan.outputs.version }} --find-links https://qinbeans.github.io/mlir-python/
            ```
          # The compiler's releases are the latest, not a package's (see packages.yml).
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*

  index:
    name: Update the package index
    needs: release
    uses: ./.github/workflows/notify-index.yml
    secrets: inherit
