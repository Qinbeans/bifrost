# Asks the package index (https://qinbeans.github.io/mlir-python/, published
# by Qinbeans/mlir-python) to republish, so it lists this repository's latest
# release wheels right away. Without this, the index still picks them up
# within an hour.
#
# Needs the secret INDEX_DISPATCH_TOKEN: a fine-grained personal access token
# with access to Qinbeans/mlir-python only and "Contents: Read and write"
# permission (required to send a repository_dispatch event).
name: Notify package index

on:
  # Releases made by release.yml use GITHUB_TOKEN, which does not
  # trigger `release` events, so that workflow calls this one directly.
  workflow_call:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Send releases-changed to Qinbeans/mlir-python
        env:
          TOKEN: ${{ secrets.INDEX_DISPATCH_TOKEN }}
        run: |
          # A pasted token often carries a trailing newline, which is not
          # valid in an HTTP header.
          GH_TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -n "$GH_TOKEN" ]; then echo "::add-mask::$GH_TOKEN"; fi
          export GH_TOKEN
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::INDEX_DISPATCH_TOKEN is not set; the package index will update on its hourly schedule"
            exit 0
          fi
          gh api repos/Qinbeans/mlir-python/dispatches -f event_type=releases-changed
          echo "Package index republish requested"
