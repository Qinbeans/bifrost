package:
  name: async
  version: 0.1.0
  description: The async project
  entry: src/async/main.bif
  # sync (the default) or async: async lets main be async, and runs it on the event loop
  type: async

flags:
  optimization: 2
  linker: clang

# Static libraries (paths, relative to this file) and system ones (names, like m).
libraries: []

# C declarations Bifrost code can import. Generate them from headers with:
#   bfc config traverse -i path/to/header.h
externs: []
