package:
  name: hello_raylib
  version: 0.1.0
  description: A simple example using Raylib
  entry: src/hello_raylib/hello_raylib.bif

flags:
  optimization: 2
  linker: clang

# raylib: extras/raylib, a package (its C library is built there first; see its README).
packages:
  raylib:
    index: bifrost_extras
    version: 0.1.2

index:
  bifrost_extras: https://qinbeans.github.io/bifrost/packages/
