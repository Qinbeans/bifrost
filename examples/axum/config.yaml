package:
  name: axum_example
  version: 0.1.0
  description: A JSON API with axum (routes, extractors, state, middleware, server-sent events)
  entry: src/axum_example/main.bif
  type: async

flags:
  optimization: 2
  linker: clang

# axum, from the package index (built from extras/axum and published there)
packages:
  axum:
    index: bifrost_extras
    version: 0.3.0

index:
  bifrost_extras: https://qinbeans.github.io/bifrost/packages/
