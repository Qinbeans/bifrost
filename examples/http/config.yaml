package:
  name: http
  version: 0.1.0
  description: A JSON API on h2o (HTTP/1.1, HTTP/2, HTTP/3)
  entry: src/http/main.bif

flags:
  optimization: 2
  linker: clang

# The HTTP server: extras/http-server, a package (its C library is built there first; see its README).
packages:
  http_server:
    path: ../../extras/http-server
