package:
  name: http
  version: 0.1.0
  description: A JSON API on h2o (HTTP/1.1, HTTP/2, HTTP/3)
  entry: src/http/main.bif

flags:
  optimization: 2
  linker: clang

# The HTTP server: the http_server package (extras/http-server), from the published index.
# To work on the package itself, use it by path instead: `path: ../../extras/http-server`.
packages:
  http_server:
    index: bifrost_extras
    version: 0.1.1

index:
  bifrost_extras: https://qinbeans.github.io/bifrost/packages/
