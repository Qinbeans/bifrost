[project]
name = "bifrost"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.6",
    "tree-sitter>=0.24.0",
    "typer>=0.15.1",
    "mlir-python>=0.2.5",
    "tree-sitter-bifrost>=0.1.19",
    "pyyaml>=6.0.3",
    "pygls>=2.0",
    "libclang>=18",
]

[project.scripts]
bfc = "bifrost.__main__:cli"

[tool.hatch.build]
include = ["bifrost"]

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost"]

[[tool.uv.index]]
name = "mlir-python"
url = "https://qinbeans.github.io/mlir-python/"
format = "flat"
explicit = true

[tool.uv.sources]
mlir-python = { index = "mlir-python" }
tree-sitter-bifrost = { index = "mlir-python" }

[project.optional-dependencies]
dev = ["nuitka>=2.6.8", "pip>=25.0.1", "pytest>=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
indent-width = 4
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "D",
    "F",
    "W",
    "C90",
    "N",
    "B",
    "B9",
    "I",
    "ERA",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "A",
    "COM",
    "C4",
    "FIX",
    "FA",
    "PIE",
    "T20",
    "PT",
    "Q",
    "SIM",
    "TC",
    "ARG",
    "PTH",
    "FLY",
    "PL",
    "UP",
    "FURB",
    "RUF",
]
fixable = ["ALL"]
ignore = [
    "TC001",
    "FBT001",
    "FBT003",
    "COM812",
    "D203",
    "D213",
    "S101",
    "RUF012",
    "D100",
    "D103",
    "D101",
    "ANN201",
    "D104",
    "D107",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402", "PLR2004"]
