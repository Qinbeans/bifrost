package:
  name: raylib
  version: 0.1.0
  build: library
  description: raylib 6.0 for Bifrost, a library for games and graphics (https://www.raylib.com)

flags:
  optimization: 2
  linker: clang

# Built by CMake first (see CMakeLists.txt): cmake -S . -B build && cmake --build build
libraries:
  - ./build/lib/libraylib.a
  - m

externs:
  - module: raylib
    description: Raylib module
    declarations:
      - name: Vector2
        type: struct
        fields:
          x: f32
          y: f32
      - name: Vector3
        type: struct
        fields:
          x: f32
          y: f32
          z: f32
      - name: Vector4
        type: struct
        fields:
          x: f32
          y: f32
          z: f32
          w: f32
      - name: Matrix
        type: struct
        fields:
          m0: f32
          m4: f32
          m8: f32
          m12: f32
          m1: f32
          m5: f32
          m9: f32
          m13: f32
          m2: f32
          m6: f32
          m10: f32
          m14: f32
          m3: f32
          m7: f32
          m11: f32
          m15: f32
      - name: Color
        type: struct
        fields:
          r: u8
          g: u8
          b: u8
          a: u8
      - name: Rectangle
        type: struct
        fields:
          x: f32
          y: f32
          width: f32
          height: f32
      - name: Image
        type: struct
        fields:
          data: ptr
          width: i32
          height: i32
          mipmaps: i32
          format: i32
      - name: Texture
        type: struct
        fields:
          id: u32
          width: i32
          height: i32
          mipmaps: i32
          format: i32
      - name: RenderTexture
        type: struct
        fields:
          id: u32
          texture: raylib_Texture
          depth: raylib_Texture
      - name: NPatchInfo
        type: struct
        fields:
          source: raylib_Rectangle
          left: i32
          top: i32
          right: i32
          bottom: i32
          layout: i32
      - name: GlyphInfo
        type: struct
        fields:
          value: i32
          offsetX: i32
          offsetY: i32
          advanceX: i32
          image: raylib_Image
      - name: Font
        type: struct
        fields:
          baseSize: i32
          glyphCount: i32
          glyphPadding: i32
          texture: raylib_Texture
          recs: ptr
          glyphs: ptr
      - name: Camera3D
        type: struct
        fields:
          position: raylib_Vector3
          target: raylib_Vector3
          up: raylib_Vector3
          fovy: f32
          projection: i32
      - name: Camera2D
        type: struct
        fields:
          offset: raylib_Vector2
          target: raylib_Vector2
          rotation: f32
          zoom: f32
      - name: Mesh
        type: struct
        fields:
          vertexCount: i32
          triangleCount: i32
          vertices: ptr
          texcoords: ptr
          texcoords2: ptr
          normals: ptr
          tangents: ptr
          colors: ptr
          indices: ptr
          boneCount: i32
          boneIndices: ptr
          boneWeights: ptr
          animVertices: ptr
          animNormals: ptr
          vaoId: u32
          vboId: ptr
      - name: Shader
