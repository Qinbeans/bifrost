package:
  name: http_server
  version: 0.1.1
  build: library
  description: A fasthttp-style HTTP server for Bifrost, on h2o (HTTP/1.1, HTTP/2, HTTP/3)

flags:
  optimization: 2
  linker: clang

# Built by CMake first (see CMakeLists.txt): cmake -B build -G Ninja && cmake --build build
libraries:
  - ./build/lib/libbifrost_http.a
  - ./build/lib/libh2o-evloop.a
  - ssl
  - crypto
  - z
  - m

externs:
  - module: http
    description: A fasthttp-style HTTP server on h2o (c/http.c)
    declarations:
      - name: App
        type: struct
        doc: "An HTTP app: its routes. Made by http.app()."
        fields:
          id: i32
      - name: Context
        type: struct
        doc: "The request a handler serves, and its response. Valid only in the handler."
        fields:
          id: i32
      - name: bifrost_http_app
        as: app
        type: function
        parameters: {}
        return: "http_App"
        doc: "A new app: add routes with http.get/post/..., then run it with http.serve."
      - name: bifrost_http_route
        as: route
        type: function
        parameters:
          app: "http_App"
          method: "cstr"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: 'Route method + pattern ("/users/:id", "/files/*") to handler.'
      - name: bifrost_http_get
        as: get
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: 'Route GET pattern ("/users/:id") to handler.'
      - name: bifrost_http_post
        as: post
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: "Route POST pattern to handler."
      - name: bifrost_http_put
        as: put
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: "Route PUT pattern to handler."
      - name: bifrost_http_patch
        as: patch
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: "Route PATCH pattern to handler."
      - name: bifrost_http_delete
        as: delete
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context) => token"
        return: "None"
        doc: "Route DELETE pattern to handler."
      - name: bifrost_http_route_with
        as: route_with
        type: function
        parameters:
          app: "http_App"
          method: "cstr"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route method + pattern to a handler given the state of http.run_with."
      - name: bifrost_http_get_with
        as: get_with
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route GET pattern to handler(ctx, state), given the state of http.run_with."
      - name: bifrost_http_post_with
        as: post_with
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route POST pattern to handler(ctx, state), given the state of http.run_with."
      - name: bifrost_http_put_with
        as: put_with
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route PUT pattern to handler(ctx, state), given the state of http.run_with."
      - name: bifrost_http_patch_with
        as: patch_with
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route PATCH pattern to handler(ctx, state), given the state of http.run_with."
      - name: bifrost_http_delete_with
        as: delete_with
        type: function
        parameters:
          app: "http_App"
          pattern: "cstr"
          handler: "(http_Context, ptr) => token"
        return: "None"
        doc: "Route DELETE pattern to handler(ctx, state), given the state of http.run_with."
      - name: bifrost_http_run_with
        as: run_with
        type: function
        parameters:
          app: "http_App"
          port: "i32"
          state: "ptr"
        return: "i32"
        doc: "Like http.run, passing state (a mem.Shared, or any owned local) to the *_with handlers while it serves."
      - name: bifrost_http_sleep
        as: sleep
        type: function
        parameters:
          milliseconds: "i64"
        return: "token"
        doc: "Wait milliseconds without blocking the server: the handler pauses, and other requests are served meanwhile."
      - name: bifrost_http_port
        as: port
        type: function
        parameters:
          fallback: "i32"
        return: "i32"
        doc: "The port in $PORT, or fallback."
      - name: bifrost_http_serve
        as: serve
        type: function
        parameters:
          app: "http_App"
          port: "i32"
        return: "i32"
        doc: "Serve HTTP/1.1 and HTTP/2 (h2c) on port until killed; returns 1 if it cannot start."
      - name: bifrost_http_serve_tls
        as: serve_tls
        type: function
        parameters:
          app: "http_App"
          port: "i32"
          cert: "cstr"
          key: "cstr"
        return: "i32"
        doc: "Serve HTTPS (HTTP/1.1, HTTP/2) and HTTP/3 on port, with a PEM certificate and key."
      - name: bifrost_http_run
        as: run
        type: function
        parameters:
          app: "http_App"
          port: "i32"
        return: "i32"
        doc: "Serve on $PORT (or port); with $TLS_CERT and $TLS_KEY set, serve HTTPS, HTTP/2 and HTTP/3."
      - name: bifrost_http_method
        as: method
        type: function
        parameters:
          ctx: "http_Context"
        return: "cstr"
        doc: 'The request method: "GET".'
      - name: bifrost_http_path
        as: path
        type: function
        parameters:
          ctx: "http_Context"
        return: "cstr"
        doc: 'The request path, without the query: "/users/7".'
      - name: bifrost_http_protocol
        as: protocol
        type: function
        parameters:
          ctx: "http_Context"
        return: "cstr"
        doc: '"HTTP/1.1", "HTTP/2" or "HTTP/3".'
      - name: bifrost_http_body
        as: body
        type: function
        parameters:
          ctx: "http_Context"
        return: "cstr"
        doc: 'The request body ("" if none).'
      - name: bifrost_http_param
        as: param
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
        return: "cstr"
        doc: 'A route parameter: "7" for :id in "/users/:id" ("" if none).'
      - name: bifrost_http_param_int
        as: param_int
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
          fallback: "i64"
        return: "i64"
        doc: "A route parameter as an integer, or fallback."
      - name: bifrost_http_query
        as: query
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
        return: "cstr"
        doc: 'A query parameter, decoded ("" if none).'
      - name: bifrost_http_query_int
        as: query_int
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
          fallback: "i64"
        return: "i64"
        doc: "A query parameter as an integer, or fallback."
      - name: bifrost_http_header
        as: header
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
        return: "cstr"
        doc: 'A request header, by case-insensitive name ("" if none).'
      - name: bifrost_http_set_header
        as: set_header
        type: function
        parameters:
          ctx: "http_Context"
          name: "cstr"
          value: "cstr"
        return: "None"
        doc: "Add a response header."
      - name: bifrost_http_text
        as: text
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
          text: "cstr"
        return: "None"
        doc: "Respond with plain text."
      - name: bifrost_http_html
        as: html
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
          html: "cstr"
        return: "None"
        doc: "Respond with HTML."
      - name: bifrost_http_json
        as: json
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
          body: "json"
        return: "None"
        doc: "Respond with JSON: a record or object (encoded for you), or JSON text."
      - name: bifrost_http_status
        as: status
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
        return: "None"
        doc: "Respond with only a status, like 204."
      - name: bifrost_http_error
        as: error
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
          message: "cstr"
        return: "None"
        doc: 'Respond {"error": message}.'
      - name: bifrost_http_redirect
        as: redirect
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
          location: "cstr"
        return: "None"
        doc: "Redirect (301, 302, 303, 307, 308) to location."
      - name: bifrost_http_json_begin
        as: json_begin
        type: function
        parameters:
          ctx: "http_Context"
          status: "i32"
        return: "None"
        doc: "Start a JSON object response; end it with http.json_end."
      - name: bifrost_http_json_str
        as: json_str
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
          value: "cstr"
        return: "None"
        doc: "Add a string (the key is ignored in an array)."
      - name: bifrost_http_json_int
        as: json_int
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
          value: "i64"
        return: "None"
        doc: "Add an integer."
      - name: bifrost_http_json_float
        as: json_float
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
          value: "f64"
        return: "None"
        doc: "Add a number."
      - name: bifrost_http_json_bool
        as: json_bool
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
          value: "bool"
        return: "None"
        doc: "Add true or false."
      - name: bifrost_http_json_null
        as: json_null
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
        return: "None"
        doc: "Add null."
      - name: bifrost_http_json_object
        as: json_object
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
        return: "None"
        doc: "Open a nested object; close it with http.json_close."
      - name: bifrost_http_json_array
        as: json_array
        type: function
        parameters:
          ctx: "http_Context"
          key: "cstr"
        return: "None"
        doc: "Open a nested array; close it with http.json_close."
      - name: bifrost_http_json_close
        as: json_close
        type: function
        parameters:
          ctx: "http_Context"
        return: "None"
        doc: "Close the innermost nested object or array."
      - name: bifrost_http_json_end
        as: json_end
        type: function
        parameters:
          ctx: "http_Context"
        return: "None"
        doc: "Close everything still open, ending the JSON."
