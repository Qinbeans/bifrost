package:
  name: game_engine
  version: 0.1.0
  build: library
  description: An http-style game engine for Bifrost on raylib, an app of pure handlers

flags:
  optimization: 2
  linker: clang

# It draws with raylib. All Bifrost: it packages as `any`, and apps get raylib's
# library (built for their target) from the raylib package.
packages:
  raylib: 0.1.2
